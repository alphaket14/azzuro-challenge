# Keyword dictionary for the rule-based topic classifier (common/topics.py).
#
# Each top-level key is one of the 8 required operational topics. Each topic
# has a list of negative_keywords (phrases that, when present, suggest a
# complaint about that topic) and positive_keywords (phrases suggesting
# praise). Matching is case-insensitive and uses word-boundary substring
# matching - see classify_review() in common/topics.py.
#
# Non-engineers can safely add/remove phrases here without touching any code.

cleanliness:
  negative_keywords:
    - dirty
    - dusty
    - mouldy
    - moldy
    - mold
    - stained
    - smelled
    - smelly
    - unclean
    - not clean
    - filthy
    - grimy
    - hair in the
  positive_keywords:
    - clean
    - spotless
    - tidy
    - fresh sheets
    - immaculate

check_in_experience:
  negative_keywords:
    - long wait
    - slow check-in
    - slow check in
    - check-in took
    - check in took
    - no one at reception
    - late check-in
    - late check in
    - waited forever
    - confusing check-in
  positive_keywords:
    - smooth check-in
    - smooth check in
    - quick check-in
    - quick check in
    - easy check-in
    - easy check in
    - early check-in
    - early check in
    - seamless check-in

